apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  labels:
    app.kubernetes.io/name: lab-api
    app.kubernetes.io/part-of: cloud-lab-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-api
        app.kubernetes.io/part-of: cloud-lab-platform
    spec:
      serviceAccountName: lab-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lab-api
      containers:
        - name: lab-api
          image: lab-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: lab-api-config
            - secretRef:
                name: lab-api-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
